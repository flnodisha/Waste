<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Waste Classifier</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #header { position: absolute; top: 0; width: 100%; text-align: center; background: rgba(0,0,0,0.8); padding: 15px 0; z-index: 10; font-size: 1.2rem; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        #captureBtn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: white; border: 6px solid #4CAF50; border-radius: 50%; cursor: pointer; z-index: 11; }
        #loading, #result { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        #loading { background: white; color: #4CAF50; }
        #result { color: #000; }
        .retry-btn { margin-top: 25px; padding: 12px 30px; background: #333; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div id="header">ପି. ଏମ୍. ଶ୍ରୀ ସରକାରୀ ଉଚ୍ଚ ବିଦ୍ୟାଳୟ, ଜଗନ୍ନାଥପୁର</div>
<video id="videoElement" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>
<button id="captureBtn"></button>

<div id="loading">
    <h2 id="loadingText">ବିଶ୍ଳେଷଣ ଚାଲିଛି... (Analyzing)</h2>
    <p>Please hold still.</p>
</div>

<div id="result">
    <h1 id="wasteTitle"></h1>
    <p id="itemName" style="font-size: 1.3rem;"></p>
    <video id="resVideo" width="200" autoplay loop muted playsinline></video>
    <button class="retry-btn" onclick="location.reload()">Try Again / ପୁଣିଥରେ</button>
</div>

<script>
    // --- STEP 1: USE YOUR FREE API KEY HERE ---
    const API_KEY = 'AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs'; 
    const MODEL = "gemini-1.5-flash"; // The best free model for images

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');

    // Start Camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(s => video.srcObject = s).catch(() => alert("Camera blocked!"));

    document.getElementById('captureBtn').onclick = async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Img = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

        loading.style.display = 'flex';

        try {
            // FIXED URL: Using /v1/models for stability
            const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL}:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Is this item biodegradable or nonbiodegradable? Reply exactly: Class: [type], Name: [item name]" },
                            { inline_data: { mime_type: "image/jpeg", data: base64Img } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Check API Key/Quota");

            const text = data.candidates[0].content.parts[0].text;
            const isBio = text.toLowerCase().includes("biodegradable") && !text.toLowerCase().includes("non");
            const name = text.split("Name:")[1]?.trim() || "Item";

            showResult(isBio, name);
        } catch (err) {
            alert("Error: " + err.message);
            loading.style.display = 'none';
        }
    };

    function showResult(isBio, name) {
        loading.style.display = 'none';
        resultDiv.style.display = 'flex';
        document.getElementById('itemName').innerText = "Detected: " + name;

        if (isBio) {
            resultDiv.style.backgroundColor = "#c8e6c9";
            document.getElementById('wasteTitle').innerText = "Biodegradable / ମାଟିରେ ମିଶିଯିବ";
            document.getElementById('resVideo').src = "bio.webm";
        } else {
            resultDiv.style.backgroundColor = "#ffcdd2";
            document.getElementById('wasteTitle').innerText = "Non-Biodegradable / ମାଟିରେ ମିଶିବ ନାହିଁ";
            document.getElementById('resVideo').src = "nonbio.webm";
        }
    }
</script>
</body>
</html>
