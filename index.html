<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classification Camera</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }

        #header {
            position: absolute;
            top: 0px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            padding: 15px 0;
            background-color: rgba(0, 0, 0, 0.6);
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        #captureBtn {
            position: absolute;
            bottom: 40px;
            width: 80px;
            height: 80px;
            background-color: white;
            border: 5px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.4);
            z-index: 1001;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #resultOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: black;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 999;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #wasteType { font-size: 1.2em; margin-bottom: 10px; }
        #itemName { font-size: 0.9em; opacity: 0.8; }

        #resultVideo {
            width: 200px;
            height: 200px;
            margin-top: 20px;
        }

        #retryButton {
            padding: 12px 30px;
            margin-top: 30px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

<div id="header">ପି. ଏମ୍. ଶ୍ରୀ ସରକାରୀ ଉଚ୍ଚ ବିଦ୍ୟାଳୟ, ଜଗନ୍ନାଥପୁର</div>

<video id="videoElement" autoplay playsinline></video>
<canvas id="canvas" style="display: none;"></canvas>

<button id="captureBtn"></button>

<div id="loadingOverlay">
    <div style="text-align:center;">
        <video id="loadingAnimation" width="300" height="300" autoplay loop muted playsinline>
            <source src="loading.webm" type="video/webm">
        </video>
        <p>Analysing / ବିଶ୍ଳେଷଣ କରାଯାଉଛି...</p>
    </div>
</div>

<div id="resultOverlay">
    <div id="wasteType"></div>
    <div id="itemName"></div>
    <video id="resultVideo" autoplay loop muted playsinline></video>
    <button id="retryButton">Try Again / ପୁଣିଥରେ</button>
</div>

<audio id="loadingSound" src="loading.mp3"></audio>
<audio id="biodegradableSound" src="bio.mp3"></audio>
<audio id="nonbiodegradableSound" src="nonbio.mp3"></audio>

<script>
    // --- CONFIGURATION ---
    // 1. RE-PASTE YOUR NEW KEY HERE
    const API_KEY = 'AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs'; 
    const MODEL_NAME = "gemini-1.5-flash"; 

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const resultOverlay = document.getElementById('resultOverlay');
    const wasteType = document.getElementById('wasteType');
    const itemName = document.getElementById('itemName');
    const resultVideo = document.getElementById('resultVideo');
    const retryButton = document.getElementById('retryButton');

    // Audio
    const loadingSound = document.getElementById('loadingSound');
    const bioSound = document.getElementById('biodegradableSound');
    const nonBioSound = document.getElementById('nonbiodegradableSound');

    // Start Camera
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = stream;
        } catch (err) {
            alert("Camera Error: Please allow camera access in your browser settings.");
        }
    }
    startCamera();

    // Capture and Process
    captureBtn.addEventListener('click', async () => {
        if (!video.videoWidth) return; // Ensure video is ready

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // Slightly lower quality (0.6) to stay within request size limits
        const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

        loadingOverlay.style.display = 'flex';
        loadingSound.play().catch(e => console.log("Audio waiting for user interaction"));

        try {
            const result = await classifyWaste(base64Image);
            displayResult(result);
        } catch (error) {
            console.error(error);
            alert(error.message);
        } finally {
            loadingOverlay.style.display = 'none';
            loadingSound.pause();
            loadingSound.currentTime = 0;
        }
    });

    async function classifyWaste(base64Data) {
        // CHANGED: Using v1 stable endpoint for better compatibility
        const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
        
        const payload = {
            contents: [{
                parts: [
                    { text: "Identify the object in this image. Is it 'biodegradable' (like food, paper, wood) or 'nonbiodegradable' (like plastic, metal, glass)? Answer strictly in this format: Classification: [type], Item: [name]" },
                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
            }]
        };

        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            if (data.error?.message.toLowerCase().includes("quota")) {
                throw new Error("Limit Reached: Please wait a few minutes and try again.");
            }
            throw new Error(`API Error: ${data.error?.message || "Connection failed"}`);
        }

        const text = data.candidates[0].content.parts[0].text;
        
        // Improved Regex to catch classification
        const typeMatch = text.match(/Classification:\s*(biodegradable|nonbiodegradable)/i);
        const itemMatch = text.match(/Item:\s*(.*)/i);

        const type = typeMatch ? typeMatch[1].toLowerCase() : 'unknown';
        const name = itemMatch ? itemMatch[1].trim() : 'Object';

        return { type, name };
    }

    function displayResult(result) {
        resultOverlay.style.display = 'flex';
        itemName.textContent = `Detected: ${result.name}`;

        if (result.type === 'biodegradable') {
            resultOverlay.style.backgroundColor = '#d4edda'; // Soft green
            wasteType.textContent = "Biodegradable / ମାଟିରେ ମିଶିଯିବ";
            resultVideo.src = "bio.webm";
            bioSound.play().catch(e => {});
        } else if (result.type === 'nonbiodegradable') {
            resultOverlay.style.backgroundColor = '#f8d7da'; // Soft red
            wasteType.textContent = "Non-Biodegradable / ମାଟିରେ ମିଶିବ ନାହିଁ";
            resultVideo.src = "nonbio.webm";
            nonBioSound.play().catch(e => {});
        } else {
            resultOverlay.style.backgroundColor = '#ffffff';
            wasteType.textContent = "Unknown / ଚିହ୍ନଟ ହୋଇପାରିଲା ନାହିଁ";
            resultVideo.src = "";
        }
        
        resultVideo.load();
        resultVideo.play().catch(e => {});
    }

    retryButton.addEventListener('click', () => {
        resultOverlay.style.display = 'none';
        bioSound.pause();
        nonBioSound.pause();
    });
</script>

</body>
</html>
