<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Classifier - PM Shri School</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#header {
    position: fixed;
    top: 0;
    width: 100%;
    text-align: center;
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 12px;
    font-size: 1.1rem;
    border-bottom: 2px solid #4CAF50;
    z-index: 10;
}

#videoElement {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#captureBtn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: white;
    border: 6px solid #4CAF50;
    box-shadow: 0 0 20px rgba(76,175,80,0.6);
    cursor: pointer;
    z-index: 20;
}

#loading, #result {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 100;
    padding: 20px;
}

#loading {
    background: white;
    color: #4CAF50;
}

#result h1 {
    font-size: 2rem;
}

.retry-btn {
    margin-top: 25px;
    padding: 12px 35px;
    border-radius: 30px;
    border: none;
    background: #333;
    color: white;
    font-size: 1rem;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="header">ପି.ଏମ୍. ଶ୍ରୀ ସରକାରୀ ଉଚ୍ଚ ବିଦ୍ୟାଳୟ, ଜଗନ୍ନାଥପୁର</div>

<video id="videoElement" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="captureBtn"></div>

<div id="loading">
    <h2>ବିଶ୍ଳେଷଣ ହେଉଛି...</h2>
    <p>Please wait, identifying waste</p>
</div>

<div id="result">
    <h1 id="wasteTitle"></h1>
    <p id="itemName" style="font-size:1.3rem;"></p>
    <button class="retry-btn" onclick="resetUI()">Try Again / ପୁଣିଥରେ</button>
</div>

<script>
/* ================= CONFIG ================= */
const API_KEY = "AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs";
const MODEL = "gemini-1.0-pro-vision";
/* ========================================== */

const video = document.getElementById("videoElement");
const canvas = document.getElementById("canvas");
const loading = document.getElementById("loading");
const resultDiv = document.getElementById("result");

// Start camera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => video.srcObject = stream)
.catch(() => alert("Camera access blocked! Please allow camera."));

document.getElementById("captureBtn").onclick = async () => {
    if (!video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const base64Img = canvas.toDataURL("image/jpeg", 0.5).split(",")[1];

    loading.style.display = "flex";

    try {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are a school waste classifier. Identify the object in the image. Reply strictly in this format: Class: Biodegradable or Non-Biodegradable, Name: item name" },
                            { inline_data: { mime_type: "image/jpeg", data: base64Img } }
                        ]
                    }],
                    generationConfig: {
                        temperature: 0.1,
                        maxOutputTokens: 60
                    }
                })
            }
        );

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "API Error");

        const text = data.candidates[0].content.parts[0].text;
        handleResult(text);

    } catch (err) {
        alert("Error: " + err.message);
        resetUI();
    }
};

function handleResult(text) {
    loading.style.display = "none";
    resultDiv.style.display = "flex";

    const lower = text.toLowerCase();
    const name = text.split("Name:")[1]?.trim() || "Unknown item";

    document.getElementById("itemName").innerText = "Detected: " + name;

    if (lower.includes("non-biodegradable")) {
        resultDiv.style.background = "#ffcdd2";
        document.getElementById("wasteTitle").innerText = "Non-Biodegradable / ମାଟିରେ ମିଶିବ ନାହିଁ";
    } else {
        resultDiv.style.background = "#c8e6c9";
        document.getElementById("wasteTitle").innerText = "Biodegradable / ମାଟିରେ ମିଶିଯିବ";
    }
}

function resetUI() {
    resultDiv.style.display = "none";
    loading.style.display = "none";
}
</script>

</body>
</html>
