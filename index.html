<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Classifier – School Demo</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}
#header{
  position:fixed;
  top:0;
  width:100%;
  background:#000c;
  color:white;
  text-align:center;
  padding:12px;
  z-index:10;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#btn{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
  border:6px solid #4CAF50;
  z-index:20;
}
#overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:white;
  color:black;
  text-align:center;
}
button{
  margin-top:20px;
  padding:10px 30px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="header">PM Shri School – Waste Classifier</div>

<video id="cam" autoplay playsinline></video>
<canvas id="cv" hidden></canvas>
<div id="btn"></div>

<div id="overlay">
  <h1 id="type">Analysing...</h1>
  <p id="name"></p>
  <button onclick="reset()">Try Again</button>
</div>

<script>
// ⚠️ TEMPORARY – REMOVE AFTER DEMO
const API_KEY = "AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs";
const MODEL = "gemini-1.5-pro";

const cam = document.getElementById("cam");
const cv = document.getElementById("cv");

navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(s => cam.srcObject = s)
.catch(()=>alert("Please allow camera"));

document.getElementById("btn").onclick = async ()=>{
  if(!cam.videoWidth) return;

  cv.width = cam.videoWidth;
  cv.height = cam.videoHeight;
  cv.getContext("2d").drawImage(cam,0,0);

  const img = cv.toDataURL("image/jpeg",0.5).split(",")[1];

  document.getElementById("overlay").style.display="flex";
  document.getElementById("type").innerText="Analysing...";
  document.getElementById("name").innerText="";

  try{
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/${MODEL}:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          contents:[{
            parts:[
              {
                text:
                "Identify the waste item. Reply ONLY in this format: Class: Biodegradable or Non-Biodegradable, Name: item"
              },
              {
                inlineData:{          // ✅ FIXED
                  mimeType:"image/jpeg",
                  data:img
                }
              }
            ]
          }],
          generationConfig:{
            temperature:0.1,
            maxOutputTokens:50
          }
        })
      }
    );

    const data = await res.json();

    if(!data.candidates){
      throw new Error("API failed");
    }

    const text = data.candidates[0].content.parts[0].text.toLowerCase();
    document.getElementById("name").innerText=text;

    if(text.includes("non")){
      document.getElementById("type").innerText="Non-Biodegradable";
      document.getElementById("overlay").style.background="#ffcdd2";
    }else{
      document.getElementById("type").innerText="Biodegradable";
      document.getElementById("overlay").style.background="#c8e6c9";
    }

  }catch(e){
    alert("Network / API error. Try again.");
    reset();
  }
};

function reset(){
  document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
