<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Classifier</title>
    <style>
        body, html { margin: 0; height: 100%; background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; text-align: center; background: #1e293b; padding: 15px 0; font-size: 1.2rem; font-weight: bold; border-bottom: 2px solid #4CAF50; }
        video { width: 100%; height: 70%; object-fit: cover; }
        #captureBtn { margin-top: 20px; width: 80px; height: 80px; background: white; border: 6px solid #4CAF50; border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(76, 175, 80, 0.4); }
        .overlay { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(255,255,255,0.95); color: #1e293b; z-index: 100; text-align: center; padding: 20px; }
        .retry-btn { margin-top: 20px; padding: 12px 30px; background: #1e293b; color: white; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">PM Shri School Waste Classifier</div>
<video id="cam" autoplay playsinline></video>
<canvas id="cv" style="display:none;"></canvas>
<button id="captureBtn"></button>

<div id="loading" class="overlay" style="background: #0f172a; color: #4CAF50;">
    <h2>Analysing Waste...</h2>
    <p>Please wait while AI identifies the item.</p>
</div>

<div id="result" class="overlay">
    <h1 id="wasteTitle"></h1>
    <p id="itemName" style="font-size: 1.2rem;"></p>
    <button class="retry-btn" onclick="location.reload()">Try Again</button>
</div>

<script>
    // --- IMPORTANT: Ensure billing is linked in Google AI Studio for this key ---
    const API_KEY = "AIzaSyBdVv6PL2d0imbo6DLXjn5uwqDEqTUa4os";
    const MODEL = "gemini-1.5-flash"; // Recommended for free tier stability

    const cam = document.getElementById("cam");
    const cv = document.getElementById("cv");

    navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}})
        .then(s => cam.srcObject = s).catch(() => alert("Camera Access Required"));

    document.getElementById("captureBtn").onclick = async () => {
        if (!cam.videoWidth) return;
        cv.width = cam.videoWidth / 2; // Resize for speed
        cv.height = cam.videoHeight / 2;
        cv.getContext("2d").drawImage(cam, 0, 0, cv.width, cv.height);
        
        const imgBase64 = cv.toDataURL("image/jpeg", 0.6).split(",")[1];
        document.getElementById("loading").style.display = "flex";

        try {
            // FIXED: Using v1beta for model compatibility
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Classify as 'biodegradable' or 'nonbiodegradable'. Respond only: Class: [type], Item: [name]" },
                            { inline_data: { mime_type: "image/jpeg", data: imgBase64 } } // Corrected key
                        ]
                    }]
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Quota limit hit. Link billing account.");

            const text = data.candidates[0].content.parts[0].text;
            const isNonBio = text.toLowerCase().includes("non");
            const name = text.split("Name:")[1]?.trim() || "Item";

            showResult(isNonBio, name);
        } catch (err) {
            alert("System Error: " + err.message);
            document.getElementById("loading").style.display = "none";
        }
    };

    function showResult(isNonBio, name) {
        document.getElementById("loading").style.display = "none";
        const resDiv = document.getElementById("result");
        resDiv.style.display = "flex";
        resDiv.style.backgroundColor = isNonBio ? "#fee2e2" : "#f0fdf4";
        document.getElementById("wasteTitle").innerText = isNonBio ? "Non-Biodegradable" : "Biodegradable";
        document.getElementById("itemName").innerText = "Item: " + name;
    }
</script>
</body>
</html>
