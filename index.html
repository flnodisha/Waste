<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classifier - PM Shri School</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #header {
            position: absolute; top: 0; width: 100%; text-align: center;
            color: white; font-size: 20px; padding: 15px 0;
            background: rgba(0,0,0,0.7); z-index: 10;
        }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        #captureBtn {
            position: absolute; bottom: 30px; width: 70px; height: 70px;
            background: white; border: 5px solid #4CAF50; border-radius: 50%;
            cursor: pointer; z-index: 11;
        }
        #loadingOverlay, #resultOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100; text-align: center; padding: 20px;
            box-sizing: border-box;
        }
        #loadingOverlay { background: white; }
        #resultOverlay { color: #000; font-weight: bold; }
        #resultVideo { width: 180px; height: 180px; margin: 20px 0; }
        .btn-retry {
            padding: 10px 25px; background: #333; color: white;
            border: none; border-radius: 20px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="header">ପି. ଏମ୍. ଶ୍ରୀ ସରକାରୀ ଉଚ୍ଚ ବିଦ୍ୟାଳୟ, ଜଗନ୍ନାଥପୁର</div>

<video id="videoElement" autoplay playsinline></video>
<canvas id="canvas" style="display: none;"></canvas>
<button id="captureBtn"></button>

<div id="loadingOverlay">
    <video width="250" autoplay loop muted playsinline>
        <source src="loading.webm" type="video/webm">
    </video>
    <h2 style="color: #4CAF50;">ବିଶ୍ଳେଷଣ ଚାଲିଛି...</h2>
    <p>Please wait while we check the item.</p>
</div>

<div id="resultOverlay">
    <h1 id="wasteType"></h1>
    <p id="itemName" style="font-size: 1.2rem;"></p>
    <video id="resultVideo" autoplay loop muted playsinline></video>
    <button class="btn-retry" onclick="resetUI()">Try Again / ପୁଣିଥରେ</button>
</div>

<audio id="soundL" src="loading.mp3"></audio>
<audio id="soundB" src="bio.mp3"></audio>
<audio id="soundNB" src="nonbio.mp3"></audio>

<script>
    // 1. USE YOUR NEW API KEY HERE
    const API_KEY = 'AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs'; 
    
    // 2. MODEL SELECTION: 
    // Use "gemini-1.5-flash" (Fast/Free) or "gemini-1.5-pro" (If you want to use your subscription)
    const MODEL_NAME = "gemini-1.5-flash"; 

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const resultOverlay = document.getElementById('resultOverlay');

    // Start Camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => alert("Camera access denied."));

    captureBtn.onclick = async () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Img = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

        loadingOverlay.style.display = 'flex';
        document.getElementById('soundL').play().catch(() => {});

        try {
            const result = await callGemini(base64Img);
            showResult(result);
        } catch (err) {
            alert("Error: " + err.message);
            resetUI();
        }
    };

    async function callGemini(base64Data) {
        // FIXED URL: Using v1 stable endpoint
        const url = `https://generativelanguage.googleapis.com/v1/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: "Identify the object. Classify as 'biodegradable' or 'nonbiodegradable'. Format response strictly as: Class: [type], Name: [name]" },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }]
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "API Failed");

        const text = data.candidates[0].content.parts[0].text;
        const isBio = text.toLowerCase().includes("biodegradable") && !text.toLowerCase().includes("nonbiodegradable");
        const isNonBio = text.toLowerCase().includes("nonbiodegradable");
        const name = text.split("Name:")[1]?.trim() || "Item";

        return { 
            type: isNonBio ? 'nonbio' : (isBio ? 'bio' : 'unknown'),
            name: name
        };
    }

    function showResult(res) {
        loadingOverlay.style.display = 'none';
        document.getElementById('soundL').pause();
        resultOverlay.style.display = 'flex';
        
        const typeTitle = document.getElementById('wasteType');
        const itemText = document.getElementById('itemName');
        const resVid = document.getElementById('resultVideo');

        itemText.innerText = "Item: " + res.name;

        if (res.type === 'bio') {
            resultOverlay.style.backgroundColor = "#c8e6c9";
            typeTitle.innerText = "Biodegradable / ମାଟିରେ ମିଶିଯିବ";
            resVid.src = "bio.webm";
            document.getElementById('soundB').play();
        } else if (res.type === 'nonbio') {
            resultOverlay.style.backgroundColor = "#ffcdd2";
            typeTitle.innerText = "Non-Biodegradable / ମାଟିରେ ମିଶିବ ନାହିଁ";
            resVid.src = "nonbio.webm";
            document.getElementById('soundNB').play();
        } else {
            typeTitle.innerText = "Unknown / ଅଜଣା ବସ୍ତୁ";
        }
        resVid.play();
    }

    function resetUI() {
        resultOverlay.style.display = 'none';
        loadingOverlay.style.display = 'none';
        document.getElementById('soundB').pause();
        document.getElementById('soundNB').pause();
    }
</script>
</body>
</html>
