<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Classifier - PM Shri School</title>
    <style>
        :root { --primary: #4CAF50; --bg: #0f172a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        #header { position: absolute; top: 0; width: 100%; text-align: center; background: rgba(15, 23, 42, 0.9); padding: 20px 0; z-index: 10; font-size: 1.4rem; font-weight: bold; border-bottom: 1px solid #334155; }
        #camView { width: 100%; height: 100%; object-fit: cover; }
        #captureBtn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 85px; height: 85px; background: white; border: 8px solid var(--primary); border-radius: 50%; cursor: pointer; z-index: 11; transition: transform 0.2s; box-shadow: 0 0 30px rgba(76, 175, 80, 0.4); }
        #captureBtn:active { transform: translateX(-50%) scale(0.9); }
        
        .overlay { position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 30px; }
        #loading { background: rgba(15, 23, 42, 0.95); }
        #result { background: white; color: #1e293b; }
        
        .spinner { width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #resVideo { width: 220px; height: 220px; border-radius: 20px; margin: 20px 0; object-fit: contain; }
        .retry-btn { padding: 15px 40px; background: #1e293b; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">ପି. ଏମ୍. ଶ୍ରୀ ସରକାରୀ ଉଚ୍ଚ ବିଦ୍ୟାଳୟ, ଜଗନ୍ନାଥପୁର</div>

<video id="camView" autoplay playsinline></video>
<canvas id="helperCanvas" style="display:none;"></canvas>
<button id="captureBtn"></button>

<div id="loading" class="overlay">
    <div class="spinner"></div>
    <h2 style="color: var(--primary)">ବିଶ୍ଳେଷଣ ଚାଲିଛି...</h2>
    <p>AI is identifying your waste item...</p>
</div>

<div id="result" class="overlay">
    <h1 id="wasteTitle" style="font-size: 2.5rem; margin: 0;"></h1>
    <p id="itemName" style="font-size: 1.4rem; color: #64748b; margin: 10px 0;"></p>
    <video id="resVideo" autoplay loop muted playsinline></video>
    <button class="retry-btn" onclick="resetUI()">Try Again / ପୁଣିଥରେ</button>
</div>

<audio id="audioL" src="loading.mp3"></audio>
<audio id="audioB" src="bio.mp3"></audio>
<audio id="audioNB" src="nonbio.mp3"></audio>

<script>
    // --- CONFIGURATION ---
    const API_KEY = 'AIzaSyDrdDLOwGIRUfO9ZjP4rFeBIuzDB1O6taU'; 
    const MODEL = "gemini-1.5-flash"; // Optimized for Free Tier

    const video = document.getElementById('camView');
    const canvas = document.getElementById('helperCanvas');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');

    // Init Camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(s => video.srcObject = s)
        .catch(() => alert("Camera Error: Please allow access and use HTTPS."));

    document.getElementById('captureBtn').onclick = async () => {
        if (!video.videoWidth) return;

        // Smart Resizing: Shrink image for faster API response
        const scale = 0.5;
        canvas.width = video.videoWidth * scale;
        canvas.height = video.videoHeight * scale;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const base64Data = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

        loading.style.display = 'flex';
        document.getElementById('audioL').play().catch(() => {});

        try {
            // New v1beta Endpoint logic
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Identify the object. Classify as 'biodegradable' or 'nonbiodegradable'. Respond only in format: Class: [type], Item: [name]" },
                            { inline_data: { mime_type: "image/jpeg", data: base64Data } } // Corrected property
                        ]
                    }],
                    generationConfig: { temperature: 0.1, maxOutputTokens: 60 }
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Quota Full");

            const aiText = data.candidates[0].content.parts[0].text;
            const isNonBio = aiText.toLowerCase().includes("non");
            const name = aiText.split("Name:")[1]?.trim() || "Waste";

            updateUI(isNonBio, name);
        } catch (err) {
            alert("Error: " + err.message);
            resetUI();
        }
    };

    function updateUI(isNonBio, name) {
        loading.style.display = 'none';
        document.getElementById('audioL').pause();
        resultDiv.style.display = 'flex';
        document.getElementById('itemName').innerText = "Detected: " + name;

        if (isNonBio) {
            resultDiv.style.background = "#fff1f2";
            document.getElementById('wasteTitle').innerText = "Non-Biodegradable / ମାଟିରେ ମିଶିବ ନାହିଁ";
            document.getElementById('wasteTitle').style.color = "#e11d48";
            document.getElementById('resVideo').src = "nonbio.webm";
            document.getElementById('audioNB').play();
        } else {
            resultDiv.style.background = "#f0fdf4";
            document.getElementById('wasteTitle').innerText = "Biodegradable / ମାଟିରେ ମିଶିଯିବ";
            document.getElementById('wasteTitle').style.color = "#16a34a";
            document.getElementById('resVideo').src = "bio.webm";
            document.getElementById('audioB').play();
        }
    }

    function resetUI() {
        resultDiv.style.display = 'none';
        loading.style.display = 'none';
        document.getElementById('audioB').pause();
        document.getElementById('audioNB').pause();
    }
</script>
</body>
</html>
