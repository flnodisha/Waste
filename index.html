<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Classifier – School Demo</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}
#header{
  position:fixed;
  top:0;
  width:100%;
  background:#000c;
  color:white;
  text-align:center;
  padding:12px;
  z-index:10;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#btn{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
  border:6px solid #4CAF50;
  z-index:20;
  cursor: pointer;
}
#overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:white;
  color:black;
  text-align:center;
  z-index: 100;
}
button{
  margin-top:20px;
  padding:10px 30px;
  font-size:16px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="header">PM Shri School – Waste Classifier</div>

<video id="cam" autoplay playsinline></video>
<canvas id="cv" style="display:none;"></canvas>
<div id="btn"></div>

<div id="overlay">
  <h1 id="type">Analysing...</h1>
  <p id="name" style="font-size: 1.2rem;"></p>
  <button onclick="reset()">Try Again</button>
</div>

<script>
const API_KEY = "AIzaSyALj-znCE7iEIkIMWk4PTlVEVsJNR-cxxs";
// Switch to flash for speed/free quota, or keep pro if you have credits
const MODEL = "gemini-1.5-flash"; 

const cam = document.getElementById("cam");
const cv = document.getElementById("cv");

navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(s => cam.srcObject = s)
.catch(()=>alert("Please allow camera access."));

document.getElementById("btn").onclick = async ()=>{
  if(!cam.videoWidth) return;

  cv.width = cam.videoWidth;
  cv.height = cam.videoHeight;
  cv.getContext("2d").drawImage(cam,0,0);

  // Compress to stay within request size limits
  const imgData = cv.toDataURL("image/jpeg", 0.5).split(",")[1];

  document.getElementById("overlay").style.display="flex";
  document.getElementById("type").innerText="Analysing...";
  document.getElementById("name").innerText="Please wait...";

  try{
    // UPDATED URL: Using v1beta for better browser compatibility
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
    
    const res = await fetch(url, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          contents:[{
            parts:[
              { text: "Identify this item. Is it 'biodegradable' or 'nonbiodegradable'? Format: Class: [type], Name: [item]" },
              {
                inline_data:{      // ✅ FIXED: Used underscore as per API specs
                  mime_type:"image/jpeg",
                  data:imgData
                }
              }
            ]
          }]
        })
      }
    );

    const data = await res.json();

    if(!res.ok){
      // Catch Quota Errors specifically
      if(data.error?.message.includes("quota")) {
        throw new Error("Quota Full: Please wait 60 seconds.");
      }
      throw new Error(data.error?.message || "API request failed");
    }

    if(!data.candidates || data.candidates.length === 0){
      throw new Error("Could not identify item. Try again.");
    }

    const text = data.candidates[0].content.parts[0].text;
    const isNonBio = text.toLowerCase().includes("nonbiodegradable") || text.toLowerCase().includes("non-bio");
    
    document.getElementById("name").innerText = text;

    if(isNonBio){
      document.getElementById("type").innerText="Non-Biodegradable";
      document.getElementById("overlay").style.background="#ffcdd2";
    } else {
      document.getElementById("type").innerText="Biodegradable";
      document.getElementById("overlay").style.background="#c8e6c9";
    }

  }catch(e){
    alert("Error: " + e.message);
    reset();
  }
};

function reset(){
  document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
